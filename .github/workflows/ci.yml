name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Narrow by default; the two jobs that need more declare it themselves.
permissions:
  contents: read

# There is no commit to hook here, and the commitlint job below is the real
# enforcement point anyway.
env:
  HUSKY: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  # The commit-msg hook is one `--no-verify` away from being bypassed, and it
  # never sees the message that actually lands: squash merges are enabled with
  # `squash_merge_commit_title: COMMIT_OR_PR_TITLE`, so a multi-commit squash
  # takes the *pull request title* as the subject on main. Both are checked.
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint walks the base..head range, which shallow clones lack.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

      # Through the environment, never interpolated into the script: a pull
      # request title is attacker-controlled text on a public repository.
      - name: Pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    env:
      DATABASE_URL: postgres://root:password@localhost:5432/aurora
      SESSION_SECRET: impossibletoguess

    services:
      postgres:
        # Pinned to the patch for the reason docker-compose.yml gives at length:
        # Postgres reads zones from its image's own OS tzdata package, so a
        # floating `postgres:16` picks up whichever release the latest rebuild
        # carried. It resolves to 16.14 / tzdata 2026b today, one release ahead
        # of the 2026a the Dockerfile asserts against `process.versions.tz` and
        # docker-compose's healthcheck refuses to start without. The
        # timezone-sensitive suites are the ones that run here, so this was the
        # one place the two zone databases were never checked against each
        # other. Move this with the pin in docker-compose.yml.
        image: postgres:16.13
        env:
          POSTGRES_DB: aurora
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The deployment path, which nothing else exercises. `pnpm build` covers the
  # app's own compilation, but the Dockerfile carries logic that only ever runs
  # here: the base stage's tzdata assertion, the `--filter web...` scoped
  # install, the `--prod` install, and the runner stage's
  # hand-assembled node_modules copy. A dependency that only resolved because a
  # dev dependency hoisted it, or a file the runner stage forgets to copy, is
  # invisible to every step above and surfaces at deploy time.
  #
  # Pull requests only: on main the publish job below builds the same image for
  # real, so running this too would build it twice.
  docker:
    name: Docker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — the image is never pushed from a pull request. This is a
      # gate, not a release step. Its own cache scope, because it builds one
      # architecture where publish builds two.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=gate
          cache-to: type=gha,mode=max,scope=gate

  # Opens (and maintains) a release pull request from the conventional commits
  # on main; merging that pull request is what bumps the version, writes
  # CHANGELOG.md, tags, and publishes the GitHub release. Gated on lint and web
  # so a red main cannot produce a release.
  release:
    name: Release
    if: github.event_name == 'push'
    needs: [lint, web]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

    steps:
      # No `release-type` input: omitting it is what makes the action read
      # release-please-config.json and .release-please-manifest.json.
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # One runner per architecture, each building natively.
  #
  # Both architectures used to be built on one amd64 runner with arm64 under
  # QEMU, and the emulated leg dominated everything: the same Dockerfile takes
  # 1m58s for amd64 alone and over 25 minutes once arm64 joins it — the app's
  # own `pnpm install` and Vite build, run through an instruction translator.
  # The repository is public, so `ubuntu-24.04-arm` is free, and the two legs
  # now run natively and concurrently instead.
  #
  # Neither leg tags anything. `push-by-digest` uploads an untagged image and
  # returns its digest, and the merge job below assembles those digests into
  # one tagged manifest list — a per-arch tag would otherwise be overwritten by
  # whichever leg finished last, leaving `latest` pointing at one architecture.
  publish:
    name: Publish (${{ matrix.suffix }})
    if: github.event_name == 'push'
    needs: [release]
    runs-on: ${{ matrix.runner }}

    strategy:
      # One architecture failing should not cancel the other: knowing whether
      # the failure is arch-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags are the merge job's business; this one carries
      # org.opencontainers.image.source, which links the package to the
      # repository and is what makes it inherit repository visibility.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs:
            type=image,name=ghcr.io/${{ github.repository
            }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture. A shared scope would have the two legs
          # overwrite each other's layers, and every run would start cold.
          cache-from: type=gha,scope=publish-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.suffix }}

      # The digest is passed to the merge job as an empty file named after it:
      # artifacts move files, and the name is the whole payload.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-architecture digests into one tagged manifest list, so a
  # single tag serves both architectures and Docker picks the right one.
  #
  # This is also where the tags are decided, keyed off the release job's output
  # rather than living in a workflow triggered `on: release`. A release created
  # with GITHUB_TOKEN does not fire `release`, `create`, or tag `push` events —
  # GitHub suppresses them so workflows cannot trigger themselves — so the
  # obvious wiring would simply never run. Reading `release_created` in the same
  # workflow avoids needing a personal access token or a GitHub App just to
  # break that loop.
  merge:
    name: Merge
    if: github.event_name == 'push'
    needs: [release, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `edge` and `sha-` land on every push to main; the version tags only on
      # the push that merged a release pull request. Every versioned entry is
      # gated on `release_created` rather than on tag_name being empty, so no
      # entry is ever handed a value to parse that isn't a tag: on an ordinary
      # push a `type=semver` with no value falls back to github.ref, which is
      # `refs/heads/main`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.release_created == 'true' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      # Fails the job if the manifest list did not come out with both
      # architectures on it — the failure mode this job exists to prevent.
      - name: Inspect
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools inspect "$IMAGE:edge"
          docker buildx imagetools inspect "$IMAGE:edge" --raw \
            | jq -e '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort == ["linux/amd64","linux/arm64"]'
